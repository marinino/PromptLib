spring.application.name=promptlib

spring.datasource.url=jdbc:postgresql://localhost:5432/promptlib
spring.datasource.username=promptlib
spring.datasource.password=promptlib

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SQL sichtbar machen + Query-Statistiken fuer die N+1-Untersuchung (Stufe 2.3)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.generate_statistics=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT (Stufe 4.1). Bewusst OHNE brauchbaren Default: wer das Secret kennt, kann fuer jeden
# Nutzer gueltige Tokens signieren - und ein Default hier stuende oeffentlich im Repo. Frueher
# gab es einen, und eine vergessene JWT_SECRET-Variable fiel beim Deployment niemandem auf.
# Jetzt bricht JwtService den Start ab, wenn nichts gesetzt ist. Lokal liefert das Profil "dev"
# ein Secret (application-dev.properties), die Tests eins in src/test/resources/config/.
promptlib.jwt.secret=${JWT_SECRET:}
promptlib.jwt.expiration-ms=3600000

# LLM-Adapter (Stufe 3). MockLlmClient ist aktiv, solange kein "real"-Profil laeuft -
# der API-Key kommt aus einer Umgebungsvariable, landet nie im Repo.
promptlib.llm.base-url=https://api.openai.com/v1
promptlib.llm.default-model=gpt-4o-mini
promptlib.llm.api-key=${LLM_API_KEY:}
promptlib.llm.connect-timeout-ms=5000
promptlib.llm.read-timeout-ms=15000

# Resilience4j fuer den LLM-Aufruf (Stufe 3.5). Kein Rate Limiting hier: "pro Nutzer"
# braucht einen Nutzer-Begriff, den es erst mit Auth in Stufe 4 gibt.
resilience4j.retry.instances.llm.max-attempts=3
resilience4j.retry.instances.llm.wait-duration=200ms
resilience4j.retry.instances.llm.enable-exponential-backoff=true
resilience4j.retry.instances.llm.exponential-backoff-multiplier=2
resilience4j.retry.instances.llm.retry-exceptions=de.marinic.promptlib.llm.LlmException

resilience4j.circuitbreaker.instances.llm.sliding-window-size=4
resilience4j.circuitbreaker.instances.llm.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=2s
resilience4j.circuitbreaker.instances.llm.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.llm.record-exceptions=de.marinic.promptlib.llm.LlmException
# Default is false, which means the breaker NEVER re-checks on its own once OPEN - it
# would stay OPEN forever (until app restart), rejecting every execution permanently even
# after the LLM recovers, defeating the entire point of a circuit breaker. Discovered by
# actually waiting past wait-duration-in-open-state and observing it stay OPEN regardless.
resilience4j.circuitbreaker.instances.llm.automatic-transition-from-open-to-half-open-enabled=true
