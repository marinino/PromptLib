# Bewusst unter config/ und nicht direkt in src/test/resources/application.properties: eine
# gleichnamige Datei im Test-Classpath wuerde die aus src/main/resources komplett ERSETZEN
# (Spring nimmt nur die erste gefundene). classpath:/config/ wird dagegen zusaetzlich geladen
# und hat Vorrang - hier also nur das, was sich fuer Tests unterscheidet.
promptlib.jwt.secret=test-only-secret-key-for-the-test-suite-at-least-32bytes+
